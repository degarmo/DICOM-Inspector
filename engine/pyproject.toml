[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-inspector"
version = "0.1.0"
description = "Read-only comparison engine for DICOM headers. Emits a JSON diff."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydicom>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dicom-inspector = "dicom_inspector.cli:main"

[tool.setuptools]
packages = ["dicom_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
